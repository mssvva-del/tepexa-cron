# Every ~15 minutes: pull comments and DMs for all Tepexa clients, the AI agent answers the simple ones.
name: tepexa-inbox
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sync inbox
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' -m 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://reels.tepexa.com/api/inbox)
          echo "HTTP $code"; head -c 600 out.json; echo
          test "$code" = 200
